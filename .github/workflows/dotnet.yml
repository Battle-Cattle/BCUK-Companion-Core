name: .NET

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Build & test Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.*.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore tests/BCUKCompanion.Core.Tests
      - run: dotnet build tests/BCUKCompanion.Core.Tests --no-restore -c Release
      # Every Core test runs here; the Windows-only ones skip themselves and run in tray-app.
      # coverage.runsettings writes lcov coverage under coverage/ for the Qlty upload.
      - run: dotnet test tests/BCUKCompanion.Core.Tests --no-build -c Release --settings coverage.runsettings --results-directory coverage
      # A publish-coverage job publishes this to Qlty.
      - name: Keep lcov coverage for the Qlty upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux
          path: coverage/
          retention-days: 1

  tray-app:
    name: Build TrayApp Shell + Sample (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.*.props') }}
          restore-keys: nuget-${{ runner.os }}-
      # One restore and one build of the whole solution: Core, Shell, Sample and both test projects.
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # The Linux job already ran the rest of the Core suite; only the tests that need Windows run here.
      - run: dotnet test tests/BCUKCompanion.Core.Tests --no-build -c Release --filter Platform=Windows --settings coverage.runsettings --results-directory coverage
      - run: dotnet test tests/BCUKCompanion.TrayApp.Shell.Tests --no-build -c Release --settings coverage.runsettings --results-directory coverage
      # A publish-coverage job publishes this to Qlty.
      - name: Keep lcov coverage for the Qlty upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-windows
          path: coverage/
          retention-days: 1

  # The Qlty uploads run in jobs of their own, so only they can mint the OIDC token qlty-action
  # trades for an upload; the restore, build and test steps never see it. GitHub gives fork and
  # Dependabot pull requests no OIDC token, and qlty-action fails the job when it can't get one,
  # so those runs skip the upload.
  # Each also waits for its own test job to pass: a failed one leaves no report to upload.
  coverage-linux:
    name: Publish Linux coverage to Qlty
    needs: core
    if: >-
      needs.core.result == 'success' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Qlty checks the report's source paths against the checkout, which lands at the same path
      # as in the test job on the same OS (coverlet writes absolute paths).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-linux
          path: coverage
      - name: Publish coverage to Qlty
        uses: qltysh/qlty-action/coverage@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0
        with:
          oidc: true
          files: coverage/**/coverage.info
          # Each OS uploads one part; Qlty merges them once both arrive.
          total-parts-count: 2

  coverage-windows:
    name: Publish Windows coverage to Qlty
    needs: tray-app
    if: >-
      needs.tray-app.result == 'success' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Qlty checks the report's source paths against the checkout, which lands at the same path
      # as in the test job on the same OS (coverlet writes absolute paths).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-windows
          path: coverage
      - name: Publish coverage to Qlty
        uses: qltysh/qlty-action/coverage@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0
        with:
          oidc: true
          files: coverage/**/coverage.info
          # Each OS uploads one part; Qlty merges them once both arrive.
          total-parts-count: 2

  publish-packages:
    name: Pack & publish NuGet packages
    needs: [core, tray-app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.*.props') }}
          restore-keys: nuget-${{ runner.os }}-
      # Building the Shell builds Core too, so both packs can skip the build.
      - run: dotnet build src/BCUKCompanion.TrayApp.Shell -c Release
      - run: dotnet pack src/BCUKCompanion.Core -c Release --no-build --output ./packages
      - run: dotnet pack src/BCUKCompanion.TrayApp.Shell -c Release --no-build --output ./packages
      - run: >
          dotnet nuget push ./packages/*.nupkg
          --source https://nuget.pkg.github.com/Battle-Cattle/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
        shell: bash
